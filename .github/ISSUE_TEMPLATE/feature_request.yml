name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        Describe the situation, not the solution. "I want my Go project's
        tests to run in the review gate" tells us more than "add Go support",
        because it says which part has to work.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What you currently do instead, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
